[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shadthon"
version = "0.1.0"
description = "Async Python framework for Shad Messenger"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "httpx>=0.27.0"
]

[tool.setuptools]
packages = ["shadthon"]